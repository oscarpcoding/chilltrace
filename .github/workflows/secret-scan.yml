name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the workflow token can only read repository contents.
permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tags can be moved).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0             # scan the full history
          persist-credentials: false # don't leave the token on the runner

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1          # explicit, never "latest"
          GITLEAKS_ENABLE_COMMENTS: false   # keeps the token read-only
