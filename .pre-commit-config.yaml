# Run `pre-commit install` once per clone to enable these hooks.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # gitleaks-system uses the locally installed (Homebrew, checksum-verified) binary.
      # CI is the pinned, enforced layer.
      - id: gitleaks-system
        # Upstream gitleaks-system omits this; without it pre-commit passes file
        # names as the source path, git errors, and gitleaks fails OPEN (exit 0).
        pass_filenames: false
